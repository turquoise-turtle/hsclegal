<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<style>
	html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
	body { background: #dc5537; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
	h1 { margin: 0; padding-top: 62px; text-align: center; color: #ffffff; font-size: 58px; font-weight: 800; letter-spacing: -0.5px; }
	.window { position: absolute; left: 50px; right: 50px; top: 190px; height: 470px; background: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
	.bar { height: 56px; background: #f1f3f5; position: relative; }
	.dot { position: absolute; top: 9px; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid; }
	.url { position: absolute; left: 66px; right: 56px; top: 20px; height: 26px; background: #ffffff; border-radius: 4px; border: 1px solid #e3e6e9; font-size: 13px; line-height: 26px; padding-left: 14px; color: #6b7280; }
	iframe { border: 0; width: 1467px; height: 555px; display: block; transform: scale(0.75); transform-origin: 0 0; }
</style>
</head>
<body>
	<h1>HSC Legal Question Generator</h1>
	<div class="window">
		<div class="bar">
			<span class="dot" style="left: 8px; border-color: #e0525b;"></span>
			<span class="dot" style="left: 22px; border-color: #e6b13c;"></span>
			<span class="dot" style="left: 36px; border-color: #3cc0c9;"></span>
			<div class="url">https://turquoise-turtle.github.io/hsclegal/</div>
		</div>
		<iframe src="site/index.html" scrolling="no"></iframe>
	</div>
</body>
</html>
